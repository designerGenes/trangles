# Fly.io config for Triangulate.
#
# The app name must be globally unique across Fly — `fly launch` will say so
# and let you pick another if "triangulate" is taken.
app = "triangulate"
primary_region = "dfw"   # closest to Texas; `fly platform regions` lists the rest

[build]
  # The Dockerfile in this directory is auto-detected.

[http_service]
  internal_port = 8080
  force_https = true

  # Sessions live in this process's memory, so there must be exactly one
  # machine and it must not be stopped underneath an active round. Fly's proxy
  # infers "idle" from connection and capacity heuristics that do not reliably
  # account for a long-lived WebSocket, so autostop is off rather than tuned:
  # a stopped machine means a team's in-progress estimates vanish mid-meeting.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

# Redis is optional. Without REDIS_URL the app runs fine and simply keeps
# everything in memory (see main.go). With it, sessions survive a redeploy.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[checks.health]
  type = "http"
  port = 8080
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
