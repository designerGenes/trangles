<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title"></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:wght@400;600&family=Spline+Sans+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- Inline so there is no extra request and no 404 for a missing icon file. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23202534'/%3E%3Cpolygon points='16,6 27,25 5,25' fill='none' stroke='%23FF6464' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="color-scheme" content="dark">
<meta name="description" content="" data-i18n-content="metaDescription">
</head>
<body>

<header class="masthead">
  <a id="home-link" class="wordmark" href="/">Tri<span class="wordmark-angle">▲</span>ngulate</a>
  <div class="masthead-actions">
    <span id="privacy-badge" class="privacy-badge" data-i18n="privacyBadge" hidden></span>
    <button id="code-chip" class="code-chip" hidden title="" data-i18n-title="copyInviteLink">
      <span data-i18n="sessionLabel"></span> <span id="code-text" class="mono"></span>
    </button>
  </div>
</header>

<!-- ───────────────────────────── landing ───────────────────────────── -->
<main id="view-landing" class="landing">
  <h1 class="pitch" data-i18n="landingPitch" data-i18n-html="true"></h1>

  <div class="landing-primary">
    <div class="card landing-card">
      <div class="landing-split">
        <div class="landing-col">
          <label class="field">
            <span data-i18n="landingNickname"></span>
            <input id="in-name" maxlength="24" autocomplete="off">
          </label>
          <button id="btn-create" class="btn btn-primary" data-i18n="landingStartSession"></button>
        </div>
        <div class="landing-rule" aria-hidden="true"></div>
        <div class="landing-col">
          <label class="field">
            <span data-i18n="landingSessionCode"></span>
            <input id="in-code" class="mono" maxlength="5" autocomplete="off"
                   placeholder="" data-i18n-placeholder="landingSessionCodePlaceholder" style="text-transform:uppercase">
          </label>
          <button id="btn-join" class="btn" data-i18n="landingJoinSession"></button>
        </div>
      </div>
      <!-- Sits below the split, so revealing it never shifts either button off
           the line they share. -->
      <p id="entry-warning" class="entry-warning" role="alert" data-i18n="landingNicknameRequired" hidden></p>
    </div>
    <button id="btn-demo" class="btn btn-quiet demo-launch" type="button" data-i18n="landingExploreDemo"></button>
  </div>

  <section id="demo-launcher" class="card demo-launcher-card" hidden aria-labelledby="demo-launcher-title">
    <div class="demo-launcher-head">
      <div>
        <span class="eyebrow" data-i18n="demoLauncherEyebrow"></span>
        <h2 id="demo-launcher-title" data-i18n="demoLauncherTitle"></h2>
      </div>
      <button id="btn-demo-close" class="btn btn-quiet" type="button" data-i18n="demoLauncherClose"></button>
    </div>
    <p class="hint" data-i18n="demoLauncherHint"></p>
    <div class="demo-choice-row">
      <button id="btn-demo-organizer" class="btn btn-primary" type="button" data-i18n="demoLauncherOrganizer"></button>
      <button id="btn-demo-participant" class="btn" type="button" data-i18n="demoLauncherParticipant"></button>
    </div>
  </section>
</main>

<!-- Floats above everything for the whole room. The organizer gets the two
     controls that matter on the clock itself, not three scrolls away. -->
<div id="timer-float" class="timer-float" hidden>
  <span id="round-timer" class="mono timer"></span>
  <div id="timer-controls" class="timer-controls" hidden>
    <button id="btn-timer-toggle" class="timer-mini" type="button" aria-label="" data-i18n="timerPause" data-i18n-aria-label="timerPauseAria"></button>
    <button id="btn-timer-clear" class="timer-mini" type="button" aria-label="" data-i18n="timerRemove" data-i18n-aria-label="timerRemoveAria"></button>
  </div>
</div>

<!-- ──────────────────────────── issue intake ───────────────────────── -->
<!-- The whole of "start pointing": one issue and a button. Everything else an
     organizer might want lives behind Session settings, because a scrum lead
     picking the next issue off a board is not configuring anything. -->
<main id="view-intake" hidden>
  <section class="card panel intake-card issues-box">
    <span id="intake-eyebrow" class="eyebrow" data-i18n="intakeEyebrow"></span>
    <h1 id="intake-title" class="intake-title" data-i18n="intakeTitle"></h1>
    <p id="intake-detail" class="hint" data-i18n="intakeDetail"></p>
    <p id="intake-tally" class="hint intake-tally" hidden></p>

    <div id="intake-items" class="intake-items"></div>

    <button id="btn-open-settings" class="btn btn-panel-action intake-settings" type="button" data-i18n="intakeSettings"></button>

    <div class="intake-actions">
      <button id="btn-launch" class="btn btn-panel-action" type="button" data-i18n="intakeLaunchSession"></button>
    </div>
    <p id="intake-warning" class="setup-warning" hidden></p>
  </section>
  <div class="intake-after-rail">
    <button id="btn-intake-results" class="btn btn-primary" type="button" data-i18n="intakeViewResults" hidden></button>
    <button id="btn-intake-back" class="btn intake-back-float" type="button" data-i18n="intakeBack" hidden></button>
  </div>
</main>

<!-- ─────────────────────────── session settings ────────────────────── -->
<!-- Everything the organizer can change but rarely needs to: aspects, the
     point range, per-issue links and descriptions, and the chart preview. -->
<main id="view-settings" hidden>
  <div class="settings-head">
    <div>
      <span class="eyebrow" data-i18n="settingsEyebrow"></span>
      <h1 class="setup-title" data-i18n="settingsTitle"></h1>
    </div>
    <div class="settings-actions">
      <button id="btn-settings-back" class="btn" type="button" data-i18n="settingsBack"></button>
      <button id="btn-close-settings" class="btn btn-primary" type="button" data-i18n="settingsLaunchSession"></button>
    </div>
  </div>

  <section class="card panel issues-box">
    <span class="eyebrow" data-i18n="settingsIssueDetailsEyebrow"></span>
    <p class="hint" data-i18n="settingsIssueDetailsHint"></p>
    <div id="settings-items" class="draft-items"></div>
    <p id="settings-items-empty" class="hint" data-i18n="settingsIssueDetailsEmpty"></p>
    <p id="settings-items-warning" class="setup-warning" hidden></p>
  </section>

  <section class="card panel aspects-box">
    <span class="eyebrow" data-i18n="settingsAspectsEyebrow"></span>
    <p class="hint" data-i18n="settingsAspectsHint"></p>
    <div id="draft-aspects" class="draft-items"></div>
    <p id="setup-aspect-warning" class="setup-warning" data-i18n="settingsAspectsWarning" hidden></p>
  </section>

  <section class="card panel point-labels-box">
    <div class="control-group">
      <input id="setup-max" type="hidden" value="8">
    </div>
    <div class="control-group">
      <span class="eyebrow" data-i18n="settingsPointLabelsEyebrow"></span>
      <p class="hint" data-i18n="settingsPointLabelsHint"></p>
      <div id="setup-point-labels"></div>
    </div>
  </section>

  <section id="setup-full-chart" class="card chart-box">
    <span class="eyebrow" data-i18n="settingsChartEyebrow"></span>
    <p id="setup-chart-loading" class="chart-loading">Loading chart...</p>
    <svg id="setup-full-plot" viewBox="-70 -45 500 434" role="img" aria-label="Full prospective estimation chart"></svg>
    <p class="hint" data-i18n="settingsChartHint"></p>
  </section>
</main>

<!-- ───────────────────────────── session ───────────────────────────── -->
<main id="view-session" hidden>

 <div id="round-stage" class="round-stage">
  <section class="card round-card">
    <div class="round-head">
      <span id="round-eyebrow" class="eyebrow" data-i18n="roundWaitingEyebrow"></span>
      <div class="round-head-actions">
        <div id="color-picker" class="color-picker" hidden>
          <button id="btn-color" class="color-swatch" type="button"
                  aria-haspopup="true" aria-expanded="false"
                  aria-label="Choose your chart colour"></button>
          <div id="color-options" class="color-options" role="menu" hidden></div>
        </div>
      </div>
    </div>
    <h2 class="round-title"><a id="round-title" data-i18n="roundWaitingTitle"></a></h2>
    <p id="round-description" class="round-description" hidden></p>

    <div id="mode-switch" class="mode-switch" role="group" aria-label="How to estimate" hidden>
      <button id="btn-mode-shape" class="btn" type="button" aria-pressed="true" data-i18n="roundModeShape"></button>
      <button id="btn-mode-simple" class="btn" type="button" aria-pressed="false" data-i18n="roundModeSimple"></button>
    </div>

    <div id="plot-wrap" class="plot-wrap chart-box">
      <p id="plot-loading" class="chart-loading">Loading chart...</p>
      <svg id="plot" viewBox="-70 -45 500 434" role="img"
           aria-label="Estimation chart"></svg>
      <div id="readouts" class="readouts"></div>
    </div>

    <!-- Simple pointing: one number instead of a shape. Carries less
         information than the chart, and the server scores it accordingly. -->
    <div id="simple-wrap" class="simple-wrap chart-box" hidden>
      <output id="simple-value" class="simple-value mono" for="simple-slider">3</output>
      <span id="simple-label" class="simple-label"></span>
      <input id="simple-slider" class="simple-slider" type="range" min="1" max="8" step="1" value="3"
             aria-label="Composite point score for this issue">
      <div class="simple-scale mono"><span id="simple-min">1</span><span id="simple-max">8</span></div>
    </div>

    <div id="submit-row" class="submit-row">
      <button id="btn-submit" class="btn btn-session-commit" disabled data-i18n="roundSubmitEstimate"></button>
      <span id="progress" class="progress mono"></span>
    </div>
  </section>

  <section id="live-inputs" class="card live-inputs chart-box" hidden>
    <div class="live-head">
      <div><span class="eyebrow" data-i18n="liveInputEyebrow"></span><p class="hint" data-i18n="liveInputHint"></p></div>
      <div class="view-switch" role="group" aria-label="Live chart view">
        <button id="btn-live-overlay" class="btn" type="button" aria-pressed="true" data-i18n="liveInputSum"></button>
        <button id="btn-live-grid" class="btn" type="button" aria-pressed="false" data-i18n="liveInputIndividual"></button>
      </div>
    </div>
    <div id="live-toggles" class="live-toggles"></div>
    <!-- Both views share one box: Individual fills the space Sum already
         occupied instead of reflowing the card around it. -->
      <div id="live-stage" class="live-stage">
         <p id="live-chart-loading" class="chart-loading" hidden>Loading chart...</p>
         <svg id="live-overlay" class="live-overlay" viewBox="-70 -45 500 434" role="img" aria-label="Summed participant chart"></svg>
        <div id="live-grid" class="live-grid" hidden></div>
        <div id="live-scores" class="live-scores" hidden></div>
        <p id="live-empty" class="hint live-empty" hidden></p>
     </div>
  </section>

  <section id="summary-card" class="card summary-card" hidden>
    <div class="summary-head">
      <div class="points-block">
        <span id="points-num" class="points-num mono">3</span>
        <span class="points-label" data-i18n="summaryStoryPoints"></span>
      </div>
      <p id="points-why" class="points-why"></p>
    </div>
    <div id="axis-stats" class="axis-stats"></div>
    <h3 id="summary-insights-title" class="insights-title" data-i18n="summaryPointingInsights"></h3>
    <ul id="observations" class="observations"></ul>
    <div id="minis" class="minis"></div>
  </section>

  <section class="people-card">
    <span class="eyebrow" data-i18n="peopleInRoom"></span>
    <div id="people" class="people"></div>
  </section>

  <section id="history-card" class="card history-card chart-box" hidden>
    <div class="history-head">
      <span class="eyebrow" data-i18n="historyCompletedIssues"></span>
      <div class="history-nav">
        <button id="btn-history-prev" class="btn history-arrow" type="button"
                aria-label="Previous completed issue">&#8592;</button>
        <span id="history-position" class="progress mono"></span>
        <button id="btn-history-next" class="btn history-arrow" type="button"
                aria-label="Next completed issue">&#8594;</button>
      </div>
    </div>
    <h3 id="history-title" class="history-title"></h3>
    <div class="history-body">
      <p id="history-chart-loading" class="chart-loading" hidden>Loading chart...</p>
      <svg id="history-chart" viewBox="-70 -45 500 434" role="img"
           aria-label="Chart for the selected completed issue"></svg>
      <div class="history-facts">
        <div class="points-block">
          <span id="history-points" class="points-num mono"></span>
          <span class="points-label" data-i18n="summaryStoryPoints"></span>
        </div>
        <div id="history-stats" class="axis-stats"></div>
        <h3 id="history-insights-title" class="insights-title" data-i18n="historyPointingInsights"></h3>
        <ul id="history-observations" class="observations"></ul>
      </div>
    </div>
    <p class="hint" data-i18n="historyHint"></p>
  </section>

 </div>

  <div id="end-rail" class="end-rail" hidden>
    <button id="btn-end" class="btn end-float" type="button" data-i18n="endNextIssue"></button>
    <span id="end-vote-count" class="end-vote-count mono"></span>
    <span id="end-hint" class="end-hint" hidden></span>
  </div>

  <!-- One drawer, one indent level. Every group heading sits at the same left
       edge as the shelf's own label so the eye reads a single column. -->
  <details id="organizer-shelf" class="organizer-shelf" hidden>
    <summary>
      <span data-i18n="organizerControls"></span>
      <span class="caret" aria-hidden="true"></span>
    </summary>
    <div class="shelf-body">
      <div id="privacy-group" class="shelf-group">
        <span class="eyebrow" data-i18n="organizerPrivacyEyebrow"></span>
        <div class="console-row">
          <label class="aspect-toggle">
            <input id="in-privacy" type="checkbox">
            <span data-i18n="organizerPrivacyLabel"></span>
          </label>
        </div>
        <p class="hint" data-i18n="organizerPrivacyHint"></p>
      </div>

      <div id="round-group" class="shelf-group">
        <span class="eyebrow" data-i18n="organizerTimerEyebrow"></span>
        <div class="console-row">
          <input id="in-seconds" class="mono" type="text" maxlength="8"
                  placeholder="" data-i18n-placeholder="organizerTimerPlaceholder" aria-label="" data-i18n-aria-label="organizerTimerAria"
                  title="" data-i18n-title="organizerTimerTitle">
          <select id="timer-scope" class="scope-select" aria-label="What this timer applies to">
            <option value="issue" data-i18n="organizerTimerOptionIssue"></option>
            <option value="remaining" data-i18n="organizerTimerOptionRemaining"></option>
          </select>
          <button id="btn-timer" class="btn" type="button" data-i18n="organizerTimerStart" hidden></button>
          <button id="btn-timer-remove" class="btn" type="button" data-i18n="organizerTimerRemove" hidden></button>
          <button id="btn-restart-round" class="btn" type="button" data-i18n="organizerTimerRestart" hidden></button>
        </div>
        <p id="timer-standing" class="hint" hidden></p>
      </div>

      <div id="pending-panel" class="shelf-group" hidden>
        <span class="eyebrow" data-i18n="organizerPendingEyebrow"></span>
        <div class="console-row">
          <span id="pending-people" class="pending-people"></span>
          <button id="btn-remind" class="btn" type="button" data-i18n="organizerPendingRemind"></button>
        </div>
      </div>

      <div class="shelf-group shelf-close-group">
        <button id="btn-close" class="btn btn-close-session" data-i18n="organizerCloseSession"></button>
      </div>
    </div>
  </details>

 <!-- Capstone. Deliberately not a .card: the session is over, and this screen
      should not read as one more step in the same stack. -->
 <section id="final-summary-card" class="final-summary-card" hidden>
   <header class="capstone-head">
     <span class="capstone-kicker" data-i18n="capstoneKicker"></span>
     <h2 class="capstone-title" data-i18n="capstoneTitle"></h2>
     <p class="capstone-sub" data-i18n="capstoneSub"></p>
   </header>
   <div class="capstone-total">
     <span id="final-points" class="capstone-points mono"></span>
     <span class="capstone-points-label" data-i18n="capstoneTotalPoints"></span>
     <span id="final-meta" class="capstone-meta mono"></span>
    </div>
    <div id="final-issues" class="final-issues"></div>
    <section id="session-insights" class="session-insights" hidden>
      <span class="capstone-kicker" data-i18n="capstoneInsightsKicker"></span>
      <ul id="final-insights" class="capstone-insights"></ul>
    </section>
    <p class="capstone-foot hint" data-i18n="capstoneFoot"></p>
 </section>

</main>

<div id="toast" class="toast" role="status" hidden></div>

<!-- A tour stays above the real UI rather than replacing it: every step points
     at the production screen being demonstrated. -->
<aside id="demo-guide" class="demo-guide" aria-live="polite" hidden>
  <div class="demo-guide-head">
    <span id="demo-step" class="eyebrow"></span>
    <button id="btn-demo-exit" class="btn btn-quiet" type="button" data-i18n="demoExit"></button>
  </div>
  <h2 id="demo-title" class="demo-title"></h2>
  <p id="demo-copy" class="demo-copy"></p>
  <section id="demo-peer-preview" class="demo-peer-preview" hidden></section>
  <div class="demo-guide-actions">
    <div class="demo-step-actions">
      <button id="btn-demo-prev" class="btn" type="button" data-i18n="demoPrevious"></button>
      <button id="btn-demo-next" class="btn" type="button" data-i18n="demoNext"></button>
    </div>
    <span id="demo-progress" class="hint"></span>
  </div>
</aside>

  <script src="i18n.js"></script>
  <script src="radar.js"></script>
  <script src="app.js"></script>
</body>
</html>
