name: Deploy Trangles

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: trangles-production-deploy
  cancel-in-progress: false

jobs:
  # The same two checks a person runs locally: go test for the server and
  # session logic, node static/ui.test.js for the client. Deploy only
  # happens if both pass — see DEPLOY.md for how to run these yourself
  # before pushing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ui

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      # wrangler deploy builds the Dockerfile image and pushes it to
      # Cloudflare's managed registry itself; the ubuntu-latest runner
      # already has a Docker daemon, so no separate build/push step is
      # needed here.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: "4.123.0"
          command: deploy
